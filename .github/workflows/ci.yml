

on:
  pull_request:
    branches: [main]      # ← el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # Verifica y publica las imágenes del commit integrado

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          tags: backend-test:ci

      - name: Ejecutar tests y exigir cobertura del backend
        id: tests
        run: |
          mkdir -p TestResults/backend
          docker run --rm -v "$PWD/TestResults/backend:/out" backend-test:ci

      - name: Mostrar resumen de cobertura del backend
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: python3 scripts/coverage-summary.py backend TestResults/backend/coverage.cobertura.xml

      - name: Generar reporte HTML del backend
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          docker run --rm --entrypoint /tools/reportgenerator \
            -v "$PWD/TestResults/backend:/out" backend-test:ci \
            -reports:/out/coverage.cobertura.xml -targetdir:/out/html \
            -sourcedirs:/src -reporttypes:Html

      - name: Publicar reportes del backend
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-tests-coverage
          path: TestResults/backend/
          if-no-files-found: error

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/geronimo2001/ingsoft3-tp01-backend:sha-${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend

      - name: Ejecutar tests y exigir cobertura del frontend
        id: tests
        run: |
          mkdir -p TestResults/frontend
          docker run --rm -v "$PWD/TestResults/frontend:/out" frontend-test:ci

      - name: Mostrar resumen de cobertura del frontend
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: python3 scripts/coverage-summary.py frontend TestResults/frontend/coverage/cobertura-coverage.xml

      - name: Publicar reportes del frontend
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-tests-coverage
          path: TestResults/frontend/
          if-no-files-found: error

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/geronimo2001/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: qa
      url: https://ingsoft3-front-qa-6z2e.onrender.com
    permissions: {}
    timeout-minutes: 30
    steps:
      - name: Desplegar en QA las imágenes del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMAGE_API: ghcr.io/geronimo2001/ingsoft3-tp01-backend:sha-${{ github.sha }}
          IMAGE_FRONT: ghcr.io/geronimo2001/ingsoft3-tp01-frontend:sha-${{ github.sha }}
        run: |
          test -n "$HOOK_API" && test -n "$HOOK_FRONT"
          echo "Imagen backend solicitada: $IMAGE_API"
          curl -fsS --max-time 30 --output /dev/null --get --data-urlencode "imgURL=$IMAGE_API" "$HOOK_API"
          echo "Imagen frontend solicitada: $IMAGE_FRONT"
          curl -fsS --max-time 30 --output /dev/null --get --data-urlencode "imgURL=$IMAGE_FRONT" "$HOOK_FRONT"

      - name: Smoke test QA (API, base y frontend)
        shell: bash
        env:
          URL_API: https://ingsoft3.onrender.com
          URL_FRONT: https://ingsoft3-front-qa-6z2e.onrender.com
        run: |
          for i in $(seq 1 30); do
            echo "Comprobando QA: intento $i de 30"
            if curl -fsS --max-time 10 --output /dev/null "$URL_API/api/products" \
               && curl -fsS --max-time 10 --output /dev/null "$URL_API/api/dashboard" \
               && curl -fsS --max-time 10 --output /dev/null "$URL_FRONT/" \
               && curl -fsS --max-time 10 --output /dev/null "$URL_FRONT/api/products"; then
              echo "QA responde: API, base, frontend y proxy"
              exit 0
            fi
            sleep 20
          done
          echo "QA no respondió a tiempo"
          exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias sin navegador
        run: npm ci
        working-directory: frontend

      - name: Probar integración contra la API real de QA
        id: tests
        env:
          API_BASE_URL: https://ingsoft3.onrender.com
        run: npm run test:integration
        working-directory: frontend

      - name: Mostrar resumen de integración
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: python3 scripts/playwright-summary.py Integración frontend/test-results/results.json

      - name: Publicar reporte de integración
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report/
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Probar los recorridos de usuario contra QA
        id: tests
        env:
          E2E_BASE_URL: https://ingsoft3-front-qa-6z2e.onrender.com
          API_BASE_URL: https://ingsoft3.onrender.com
        run: npm run test:e2e
        working-directory: frontend

      - name: Mostrar resumen e2e
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: python3 scripts/playwright-summary.py E2E frontend/test-results/results.json

      - name: Publicar reporte e2e
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report/
          if-no-files-found: error
          retention-days: 30

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    environment:
      name: production
      url: https://ingsoft3-front-prod-553q.onrender.com
    permissions: {}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Desplegar en PROD las mismas imágenes verificadas en QA
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          IMAGE_API: ghcr.io/geronimo2001/ingsoft3-tp01-backend:sha-${{ github.sha }}
          IMAGE_FRONT: ghcr.io/geronimo2001/ingsoft3-tp01-frontend:sha-${{ github.sha }}
        run: |
          test -n "$HOOK_API" && test -n "$HOOK_FRONT"
          echo "Imagen backend solicitada: $IMAGE_API"
          curl -fsS --max-time 30 --output /dev/null --get --data-urlencode "imgURL=$IMAGE_API" "$HOOK_API"
          echo "Imagen frontend solicitada: $IMAGE_FRONT"
          curl -fsS --max-time 30 --output /dev/null --get --data-urlencode "imgURL=$IMAGE_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD (API, base y frontend)
        shell: bash
        env:
          URL_API: https://ingsoft3-api-prod-3hji.onrender.com
          URL_FRONT: https://ingsoft3-front-prod-553q.onrender.com
        run: |
          for i in $(seq 1 30); do
            echo "Comprobando PROD: intento $i de 30"
            if curl -fsS --max-time 10 --output /dev/null "$URL_API/api/products" \
               && curl -fsS --max-time 10 --output /dev/null "$URL_API/api/dashboard" \
               && curl -fsS --max-time 10 --output /dev/null "$URL_FRONT/" \
               && curl -fsS --max-time 10 --output /dev/null "$URL_FRONT/api/products"; then
              echo "PROD responde: API, base, frontend y proxy"
              exit 0
            fi
            sleep 20
          done
          echo "PROD no respondió a tiempo"
          exit 1

